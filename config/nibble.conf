# --- Device name (shown in the Bluetooth device list) ---
CONFIG_ZMK_KEYBOARD_NAME="Sisyphus"

# --- Rotary encoder (EC11) ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- OLED display: battery percentage only ---
# Built-in status screen with every widget except battery turned off, and the
# battery widget set to show a number. Note: it sits where the stock layout
# puts it (not a big centered number - that needs a custom screen), and the
# percentage is only as accurate as this clone's battery reading (see below).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# --- Power / sleep ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000   # deep sleep after 30 min idle

# --- Battery reporting ---
# The genuine nice!nano v2 measures the chip's own VDDH rail (battery/5) with
# NO external resistor divider, so there are no values to "recalibrate". On
# AITRIP-style nRF52840 clones this reading is coarse and non-linear near full,
# which is the "100% ... then 13% ... then off" behaviour. Mitigations:
#   - report more often so the % is less stale (below)
#   - the old config's USB + RTT logging and OLED (big drains) are already gone
#   - charge when it drops below ~30%; treat the number as approximate
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=20

# --- RGB underglow ---
# Uncomment to disable if the board has no underglow LEDs fitted.
# CONFIG_ZMK_RGB_UNDERGLOW=n
