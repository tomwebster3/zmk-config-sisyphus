# --- Rotary encoder (EC11) ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- OLED display (SSD1306 128x32, defined by the nibble shield) ---
CONFIG_ZMK_DISPLAY=y

# --- Power / sleep ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000   # deep sleep after 30 min idle

# --- RGB underglow ---
# The nibble shield supports WS2812 underglow. Uncomment to disable it if your
# board has no underglow LEDs fitted (saves a little flash).
# CONFIG_ZMK_RGB_UNDERGLOW=n
