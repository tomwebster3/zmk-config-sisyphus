# --- Device name (shown in the Bluetooth device list) ---
CONFIG_ZMK_KEYBOARD_NAME="Sisyphus"

# --- Rotary encoder (EC11) ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- OLED display ---
# Left OFF for now. ZMK's built-in OLED screen works but is plain, it costs
# noticeable battery, and there is NO built-in bongo cat (that needs a custom
# module - exactly the kind of custom C code that broke the old config).
# To try the stock status screen (layer / battery / BT), uncomment:
# CONFIG_ZMK_DISPLAY=y

# --- Power / sleep ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000   # deep sleep after 30 min idle

# --- Battery reporting ---
# On by default. The "100% then collapse to 13% then off" behaviour is the
# nice!nano *clone* reading its battery voltage through a divider that doesn't
# match the genuine board's calibration. Not fixable blindly - needs either the
# clone's resistor values or a confirmed board model, then a per-board
# nice_nano_v2.overlay override of the `vbatt` node.

# --- RGB underglow ---
# Uncomment to disable if the board has no underglow LEDs fitted.
# CONFIG_ZMK_RGB_UNDERGLOW=n
